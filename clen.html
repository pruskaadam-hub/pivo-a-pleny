<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Můj účet | Pivo &amp; Pleny</title>
<meta name="description" content="Přihlášení a registrace do Pivo &amp; Pleny. Účet je zdarma, členství v Klubu odemyká celý obsah.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=202610240030">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  .zone { max-width: 860px; }
  .login-card { background: #fff; border: 2px solid var(--ink); border-radius: var(--r-card); box-shadow: var(--pop); padding: clamp(24px, 4vw, 40px); max-width: 520px; }
  .login-card input { width: 100%; font: inherit; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); margin: 6px 0 14px; }
  .login-card input:focus { outline: none; border-color: var(--ink); background: #fff; }
  .z-msg { min-height: 1.4em; margin: 10px 0 0; }
  .z-msg.err { color: var(--red); }
  .z-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .z-status { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--surface-2); }
  .z-status.active { background: #D7F5DF; color: #0B6B2B; }
  .z-status.pending { background: #FFF3C4; color: #7A5B00; }
  .plan12 { display: grid; gap: 12px; padding: 0; list-style: none; }
  .steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 26px; padding: 0; list-style: none; counter-reset: s; }
  .steps3 li { background: var(--surface); border-radius: 16px; padding: 14px 16px; font-size: .92rem; counter-increment: s; }
  .steps3 li::before { content: counter(s); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 700; font-size: .8rem; margin-right: 8px; }
  .steps3 li.on { background: var(--gold); }
  .steps3 li.on::before { background: #fff; color: var(--ink); }
  @media (max-width: 700px) { .steps3 { grid-template-columns: 1fr; } }
  .reg-mini { display: grid; gap: 12px; max-width: 560px; }
  .reg-mini textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; }
  .tl { background: #fff; border: 2px solid var(--ink); box-shadow: var(--pop); }
  .tl-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .tl-big { font-family: var(--f-loud); text-transform: uppercase; font-size: clamp(1.6rem, 4vw, 2.6rem); letter-spacing: -.03em; line-height: 1; margin: 6px 0 8px; }
  .tl-bar { position: relative; height: 44px; margin: 34px 0 8px; border-radius: 12px; background: var(--surface); }
  .tl-seg { position: absolute; top: 0; bottom: 0; border-right: 2px solid #fff; }
  .tl-seg span { position: absolute; top: -22px; left: 4px; font-size: .74rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .tl-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 12px 0 0 12px; }
  .tl-dot { position: absolute; bottom: 6px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--ink); }
  .tl-now { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 3px solid var(--ink); }
  .tl-now b { position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%); background: var(--ink); color: #fff; font-size: .8rem; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; display: grid; place-items: center; }
  .memb.paid { border: 2px solid var(--ink); }
  .nl-item { border-top: 1px solid var(--line); padding: 12px 0; }
  .nl-item summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .nl-item summary::-webkit-details-marker { display: none; }
  .nl-body { background: var(--surface); border-radius: 14px; padding: 16px 18px; margin-top: 10px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--surface-2); }
  .pill.on { background: var(--gold); }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; color: inherit; }
  .reg-mini input, .reg-mini select { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; }
  .plan12 li { background: var(--surface); border-radius: 16px; padding: 14px 18px; display: grid; grid-template-columns: 110px 1fr; gap: 14px; }
  .plan12 b { font-family: var(--f-loud); text-transform: uppercase; font-weight: 400; letter-spacing: -.02em; }
  @media (max-width: 600px) { .plan12 li { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body data-no-float>
<header id="site-header"></header>
<main>
  <section class="page-hero grain" id="z-hero">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Úvod</a> / Můj účet</div>
      <span class="kicker">Můj účet</span>
      <h1>Přihlas se, nebo<br>se zaregistruj.</h1>
      <p class="lead">Účet je zdarma a stačí ti k němu e-mail – žádné heslo, pošleme ti odkaz. S účtem si můžeš koupit členství v Klubu a hlásit se na akce a konzultace.</p>
    </div>
  </section>

  <section>
    <div class="wrap zone" id="zone">
      <p class="muted">Načítám…</p>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js?v=202610240030"></script>
<script src="assets/js/main.js?v=202610240030"></script>
<script src="assets/js/media.js?v=202610240030"></script>
<script>
(async function () {
  const C = window.PP_CONFIG;
  const sb = supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit", storageKey: "pp-member-auth" } });
  const zone = document.getElementById("zone");
  const QT = { A: "Architekt", P: "Parťák", Z: "Živitel", H: "Hravý táta", S: "Strážce" };
  const esc = PPMedia.esc;
  const list = arr => `<ul>${(arr || []).map(x => `<li>${x}</li>`).join("")}</ul>`; // obsah rozboru píšeme my, smí obsahovat odkazy
  const quiz = () => { try { const q = JSON.parse(sessionStorage.getItem("pp-quiz") || "null"); return q && QT[q.typ] ? q : null; } catch (e) { return null; } };
  const steps = n => `<ol class="steps3"><li class="${n === 1 ? "on" : ""}"><strong>Účet zdarma</strong><br>dotazník, Cage, newsletter, ukázky</li><li class="${n === 2 ? "on" : ""}"><strong>Člen Klubu</strong><br>celý rozbor, tipy na míru, audia, Q&amp;A</li><li class="${n === 3 ? "on" : ""}"><strong>Akce a konzultace</strong><br>workshopy, setkání, konzultace 1:1</li></ol>`;

  function loginForm(msg) {
    document.getElementById("z-hero").classList.remove("hidden"); if (window.PPAuth) PPAuth.refresh();
    zone.innerHTML = steps(0) + `
      <form class="login-card" id="z-login">
        <h2>Přihlášení a registrace</h2>
        <p>Napiš svůj e-mail. Pošleme ti odkaz – kliknutím se přihlásíš, a pokud účet ještě nemáš, rovnou ho založíme. Zdarma.</p>
        <label for="z-email"><strong>E-mail</strong></label>
        <input id="z-email" type="email" required autocomplete="email" placeholder="tvuj@email.cz">
        <button class="btn btn-dark" type="submit">Poslat odkaz</button>
        <p class="z-msg ${msg && msg.err ? "err" : ""}" id="z-msg" role="status">${msg ? esc(msg.text) : ""}</p>
        <p class="small muted mb-0">Chceš rovnou členství? <a href="klub.html#registrace">Koupit Klub</a> – účet ti založíme automaticky.</p>
      </form>`;
    document.getElementById("z-login").addEventListener("submit", async e => {
      e.preventDefault();
      const em = document.getElementById("z-email"), out = document.getElementById("z-msg");
      if (!em.checkValidity()) { em.reportValidity(); return; }
      out.className = "z-msg"; out.textContent = "Posílám…";
      const { error } = await sb.auth.signInWithOtp({ email: em.value.trim(), options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      if (error) { out.className = "z-msg err"; out.textContent = /rate|limit|seconds/i.test(error.message) ? "Odkaz jsme ti posílali před chvílí. Zkus to prosím za pár minut." : "Odkaz se nepodařilo poslat. Zkus to prosím znovu."; return; }
      out.textContent = "Hotovo. Mrkni do e-mailu (i do spamu) a klikni na odkaz. Otevře se tady.";
    });
  }

  function finishForm(d) {
    const q = quiz();
    zone.innerHTML = head(d) + steps(1) + `
      <form class="login-card reg-mini" id="z-reg">
        <h2 style="margin:0">Dokonči registraci</h2>
        <p class="mb-0">Pár údajů, ať ti posíláme jen to, co se tě týká.</p>
        <label><strong>Jméno nebo přezdívka</strong><input name="jmeno" required maxlength="80" autocomplete="given-name"></label>
        <label><strong>Kde zrovna jste?</strong><select name="faze"><option value="">Nechci uvádět</option><option value="planujeme">Plánujeme</option><option value="tehotenstvi">Čekáme miminko</option><option value="po-porodu">Miminko je na světě</option></select></label>
        <label class="hidden" id="z-due"><strong>Termín porodu</strong><input type="date" name="termin_porodu"></label>
        <label class="hidden" id="z-birth"><strong>Datum narození miminka</strong><input type="date" name="datum_narozeni"></label>
        ${q ? `<p class="small mb-0">K účtu uložíme i tvůj výsledek dotazníku: <strong>${QT[q.typ]}</strong>.</p>` : ""}
        <label class="check"><input type="checkbox" name="gdpr" required> Souhlasím se zpracováním údajů pro vedení účtu. Nikomu je neprodáme.</label>
        <label class="check"><input type="checkbox" name="news" checked> Chci nedělní newsletter (3 rady na týden)</label>
        <button class="btn btn-dark" type="submit">Založit účet</button>
        <p class="z-msg" id="z-msg2" role="status"></p>
      </form>`;
    bindOut();
    const f = document.getElementById("z-reg");
    f.faze.onchange = () => { document.getElementById("z-due").classList.toggle("hidden", f.faze.value !== "tehotenstvi"); document.getElementById("z-birth").classList.toggle("hidden", f.faze.value !== "po-porodu"); };
    f.addEventListener("submit", async e => {
      e.preventDefault(); if (!f.reportValidity()) return;
      const out = document.getElementById("z-msg2"); out.textContent = "Ukládám…";
      const { error } = await sb.rpc("account_register", { p: { jmeno: f.jmeno.value.trim(), faze: f.faze.value, termin_porodu: f.termin_porodu.value, datum_narozeni: f.datum_narozeni.value, souhlas_gdpr: f.gdpr.checked, souhlas_marketing: f.news.checked, dotaznik: q } });
      if (error) { out.className = "z-msg err"; out.textContent = "Registraci se nepodařilo uložit. Zkus to prosím znovu."; return; }
      try { sessionStorage.removeItem("pp-quiz"); } catch (e2) {}
      load();
    });
  }

  const head = d => `<div class="z-head"><div><span class="kicker">Přihlášen jako ${esc(d.email)}</span><h2 style="margin:6px 0 0">${d.name ? "Ahoj, " + esc(d.name) + "." : "Ahoj."}</h2></div>
      <div class="flex" style="gap:8px;align-items:center">${d.member ? badge(d) : ""}<button class="btn btn-ghost btn-sm" id="z-out" type="button">Odhlásit</button></div></div>`;
  const badge = d => d.admin ? `<span class="z-status active">Zakladatel · plný přístup</span>`
    : d.level >= 1 ? `<span class="z-status active">${esc(d.tier_name || "Klub")}${d.comp ? " zdarma" : d.paid_until ? " do " + new Date(d.paid_until).toLocaleDateString("cs-CZ") : ""}</span>`
    : d.status === "pending" ? `<span class="z-status pending">Členství čeká na platbu</span>` : `<span class="z-status">Účet zdarma</span>`;
  function bindOut() {
    document.getElementById("z-hero").classList.add("hidden"); if (window.PPAuth) PPAuth.refresh();
    const b = document.getElementById("z-out"); if (b) b.onclick = async () => { await sb.auth.signOut(); if (window.PPAuth) PPAuth.refresh(); loginForm(); };
  }

  function rozbor(d) {
    const r = d.rozbor, t = d.quiz_type;
    return `<span class="kicker" style="display:block">Tvůj rozbor</span><div class="result-type">${QT[t]}</div>
      ${d.quiz_profile ? `<div class="bars">${Object.entries(d.quiz_profile).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span>${QT[k] || k}</span><span class="track"><span style="width:${Math.min(v / 12 * 100, 100)}%"></span></span><span>${Math.round(v / 12 * 100)} %</span></div>`).join("")}</div>` : ""}
      <div class="grid g2 mt-2"><div><h3>V čem jsi silný</h3>${list(r.good)}</div><div><h3>Na co si dát pozor</h3>${list(r.watch)}</div></div>
      <h3 class="mt-2">Co s tím tento týden</h3>${list(r.tips)}
      <h3 class="mt-2">Jak ladíš s partnerkou</h3>${list(r.partner)}
      <h3 class="mt-2">Plán na prvních 12 týdnů po porodu</h3>
      <ol class="plan12">${(r.plan || []).map(([a, b]) => `<li><b>${esc(a)}</b><span>${b}</span></li>`).join("")}</ol>
      <div class="flex mt-2"><a class="btn btn-ghost btn-sm" href="dotaznik.html">Udělat dotazník znovu</a></div>`;
  }

  /* ---------- Můj prostor ---------- */
  const fmtD = v => v ? new Date(v).toLocaleDateString("cs-CZ") : "";
  const tydnu = n => n === 1 ? "týden" : n >= 2 && n <= 4 ? "týdny" : "týdnů";
  function timeline(d) {
    const w = d.week;
    if (!w) return `<div class="tl card"><h3 style="margin:0 0 6px">Kde zrovna jste?</h3><p class="mb-0">Doplň fázi a termín porodu (nebo datum narození) – ukážeme ti, ve kterém týdnu jste, a pošleme jen to, co se vás týká. <button class="btn btn-dark btn-sm" type="button" data-edit>Doplnit</button></p></div>`;
    let max, segs, big, sub = "";
    if (w.phase === "tehotenstvi") {
      max = 40; segs = [[1, 13, "1. trimestr"], [14, 27, "2. trimestr"], [28, 40, "3. trimestr"]];
      big = `${w.week}. týden těhotenství`;
      sub = w.days_left > 0 ? `Do termínu (${fmtD(d.due_date)}) zbývá ${Math.ceil(w.days_left / 7)} ${tydnu(Math.ceil(w.days_left / 7))}.` : w.days_left > -14 ? "Termín je tady. Držíme palce!" : `Termín byl ${fmtD(d.due_date)}. Miminko už je na světě? <button class="linkbtn" type="button" data-edit>Doplň datum narození</button>`;
    } else if (w.phase === "po-porodu") {
      max = 52; segs = [[0, 6, "Šestinedělí"], [7, 13, "Do 3 měsíců"], [14, 26, "Do půl roku"], [27, 52, "Do roka"]];
      big = w.week < 9 ? `Miminku je ${w.week} ${tydnu(w.week)}` : `Miminku je ${Math.floor(w.week / 4.35)} měsíců`;
      sub = `Narozeno ${fmtD(d.birth_date)} · ${w.week}. týden po porodu`;
    } else {
      max = 12; segs = [[1, 4, "Rozhodnutí"], [5, 8, "Příprava"], [9, 12, "Snažení"]];
      big = `Příprava: ${w.week}. týden z 12`; sub = "Až budete čekat miminko, doplň termín porodu a přepneme tě na týdny těhotenství.";
    }
    const lo = segs[0][0], pos = n => ((n - lo) / (max - lo)) * 100;
    return `<div class="tl card">
      <div class="tl-top"><div><span class="kicker" style="display:block">Kde jste teď</span><div class="tl-big">${big}</div><p class="small mb-0">${sub}</p></div><button class="btn btn-ghost btn-sm" type="button" data-edit>Upravit</button></div>
      <div class="tl-bar">${segs.map(([a, b, l]) => `<div class="tl-seg" style="left:${pos(a)}%;width:${pos(b) - pos(a)}%"><span>${l}</span></div>`).join("")}
        <div class="tl-fill" style="width:${pos(Math.min(w.week, max))}%"></div>
        ${(window.__issues || []).map(i => `<i class="tl-dot" style="left:${pos(i.week)}%" title="Newsletter ${i.week}. týden"></i>`).join("")}
        <div class="tl-now" style="left:${pos(Math.min(w.week, max))}%"><b>${w.week}</b></div></div>
    </div>`;
  }
  function profileForm(d) {
    return `<form class="card reg-mini hidden" id="z-prof" style="max-width:none">
      <h3 style="margin:0">Tvůj profil</h3>
      <div class="grid g2"><label><strong>Jméno</strong><input name="jmeno" value="${esc(d.name || "")}" maxlength="80"></label>
      <label><strong>Fáze</strong><select name="faze"><option value="">Neuvedeno</option><option value="planujeme">Plánujeme</option><option value="tehotenstvi">Čekáme miminko</option><option value="po-porodu">Miminko je na světě</option></select></label>
      <label data-f="tehotenstvi"><strong>Termín porodu</strong><input type="date" name="termin_porodu" value="${d.due_date || ""}"></label>
      <label data-f="po-porodu"><strong>Datum narození miminka</strong><input type="date" name="datum_narozeni" value="${d.birth_date || ""}"></label></div>
      <div class="flex"><button class="btn btn-dark btn-sm" type="submit">Uložit</button><button class="btn btn-ghost btn-sm" type="button" data-close>Zavřít</button></div>
    </form>`;
  }
  function membership(d) {
    const paid = d.level >= 1;
    const perks = paid ? ["Celý rozbor dotazníku", "Newslettery na míru tvému týdnu", "Celá knihovna Táta za 5 minut", "Q&A s odborníky a setkání tátů", "Sleva 20 % na akce a konzultace"]
      : ["Dotazník a typ táty", "Cage – čtení i psaní", "Ukázky audií", "Nedělní newsletter"];
    return `<div class="card memb ${paid ? "paid" : ""}">
      <span class="kicker" style="display:block">Tvoje členství</span>
      <div class="tl-big" style="font-size:1.6rem">${d.admin ? "Zakladatel" : paid ? esc(d.tier_name || "Klub") : d.status === "pending" ? esc(d.tier_name || "Klub") + " · čeká na platbu" : "Účet zdarma"}</div>
      <p class="small">${d.admin ? "Plný přístup ke všemu." : d.comp ? "Členství zdarma." : paid ? (d.paid_until ? `Zaplaceno do ${fmtD(d.paid_until)}` : "Aktivní") + (d.plan ? ` · ${d.plan === "rocne" ? "ročně" : "měsíčně"}` : "") : d.status === "pending" ? "Platby spouštíme už brzy – pak se ti obsah Klubu odemkne." : "Zdarma navždy. Kdykoli můžeš přejít do Klubu."}</p>
      <ul class="ticks-list">${perks.map(x => `<li>${x}</li>`).join("")}</ul>
      ${paid || d.status === "pending" ? "" : `<a class="btn btn-dark btn-sm" href="klub.html#registrace">Přejít do Klubu</a>`}
    </div>`;
  }
  function voice() {
    return `<div class="card voice"><span class="kicker" style="display:block">Tvůj hlas</span><h3 style="margin:4px 0 6px">Sdílej, co prožíváš</h3>
      <form id="z-cage" class="reg-mini" style="max-width:none">
        <select name="cat"><option value="psychika">Hlava (strach, únava, vztek)</option><option value="porod">Porod</option><option value="vztah">Vztah a sex</option><option value="otcovstvi">Otcovství a dítě</option></select>
        <textarea name="text" rows="4" maxlength="1500" placeholder="Nikomu jsem neřekl, že… (anonymně do Cage, zveřejníme po moderaci)" required></textarea>
        <div class="flex"><button class="btn btn-dark btn-sm" type="submit">Poslat do Cage anonymně</button><a class="small" href="cage.html">Číst Cage →</a></div><p class="small z-msg" data-msg></p>
      </form>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <form id="z-myth" class="reg-mini" style="max-width:none">
        <label><strong>Slyšel jsi mýtus, který tě štve?</strong><input name="text" maxlength="500" placeholder="Např. „Chlap u porodu jen překáží.“" required></label>
        <div class="flex"><button class="btn btn-ghost btn-sm" type="submit">Navrhnout mýtus</button><a class="small" href="myty.html">Bořiči mýtů →</a></div><p class="small z-msg" data-msg></p>
      </form></div>`;
  }
  function issuesBlock(d, list) {
    if (!d.week) return "";
    if (!list.length) return `<div class="card"><span class="kicker" style="display:block">Tvoje newslettery</span><p class="mb-0">Zatím pro tvůj týden nic nemáme. První e-mail ti přijde, jakmile ho připravíme.</p></div>`;
    const vars = { jmeno: d.name || "", tyden: d.week.week };
    const label = i => d.week.phase === "planujeme" ? `${i.week}. e-mail` : d.week.phase === "po-porodu" ? `${i.week}. týden po porodu` : `${i.week}. týden`;
    return `<div class="card"><span class="kicker" style="display:block">Tvoje newslettery · ${list.length}</span>
      ${list.map((i, k) => `<details class="nl-item" ${k === 0 ? "open" : ""}><summary><span class="pill${i.is_current ? " on" : ""}">${label(i)}${i.is_current ? " · tento týden" : ""}</span> <strong>${esc(i.subject || "")}</strong></summary>
        ${i.locked ? `<p class="small mb-0">🔒 Celý text je pro členy Klubu. <a href="klub.html#registrace">Odemknout</a></p>` : `<div class="nl-body">${PPMedia.md(i.body, vars)}</div>`}</details>`).join("")}</div>`;
  }

  async function load() {
    let d;
    try { const r = await sb.rpc("member_home"); if (r.error) throw r.error; d = r.data; }
    catch (x) { return loginForm({ err: true, text: "Přihlášení vypršelo. Pošli si prosím nový odkaz." }); }
    if (!d.member) return finishForm(d);
    const iss = await sb.rpc("member_issues"); const list = iss.error ? [] : iss.data || [];
    window.__issues = list;
    const paid = d.level >= 1;
    let html = head(d) + timeline(d) + profileForm(d) +
      `<div class="grid g2 mt-2" style="align-items:start">${membership(d)}${voice()}</div>` +
      `<div class="mt-2">${issuesBlock(d, list)}</div>`;
    html += `<div class="mt-3">${paid ? (d.quiz_type && d.rozbor ? rozbor(d) : `<div class="callout calm"><h4>Rozbor tvého typu táty</h4><p>Zatím u tebe nemáme výsledek dotazníku. Vyplň ho – za 3 minuty tu uvidíš celý rozbor a plán na prvních 12 týdnů.</p><a class="btn btn-dark" href="dotaznik.html">Vyplnit dotazník</a></div>`)
      : `<div class="callout calm"><h4>${d.quiz_type ? "Tvůj typ táty: " + QT[d.quiz_type] : "Jaký jsi táta?"}</h4><p class="mb-0">${d.quiz_type ? "Celý rozbor, jak ladíš s partnerkou a plán na 12 týdnů uvidíš jako člen Klubu." : '<a href="dotaznik.html">Zjisti to zdarma za 3 minuty →</a>'}</p></div>`}</div>`;
    html += `<div class="callout mt-3"><h4>Akce a konzultace</h4><p class="mb-0">Konzultace 1:1 s porodní asistentkou nebo psychologem si můžeš objednat <a href="klub.html#konzultace">tady</a>${paid ? " se slevou pro členy" : ""}. Workshopy a setkání tátů vypisujeme postupně – dáme vědět e-mailem.</p></div>`;
    zone.innerHTML = html; bindOut(); bindSpace(d);
    const q = quiz();
    if (q && (q.typ !== d.quiz_type || JSON.stringify(q.profil) !== JSON.stringify(d.quiz_profile))) {
      const n = document.createElement("div"); n.className = "quiz-banner";
      n.innerHTML = `<span>Nový výsledek dotazníku: <b>${QT[q.typ]}</b></span><button class="btn btn-dark btn-sm" type="button">Uložit k účtu</button>`;
      zone.prepend(n);
      n.querySelector("button").onclick = async () => { const s = await sb.rpc("member_save_quiz", { p_typ: q.typ, p_profil: q.profil }); if (!s.error) { sessionStorage.removeItem("pp-quiz"); load(); } };
    }
    zone.insertAdjacentHTML("beforeend", '<div id="z-media" class="mt-3"></div>');
    renderMedia(d);
  }

  function bindSpace(d) {
    const pf = document.getElementById("z-prof");
    const showF = () => pf.querySelectorAll("[data-f]").forEach(l => l.classList.toggle("hidden", l.dataset.f !== pf.faze.value));
    pf.faze.value = d.phase || ""; showF(); pf.faze.onchange = showF;
    zone.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { pf.classList.remove("hidden"); pf.scrollIntoView({ behavior: "smooth", block: "center" }); });
    pf.querySelector("[data-close]").onclick = () => pf.classList.add("hidden");
    pf.onsubmit = async e => { e.preventDefault(); const { error } = await sb.rpc("member_update_profile", { p: { jmeno: pf.jmeno.value, faze: pf.faze.value, termin_porodu: pf.faze.value === "tehotenstvi" ? pf.termin_porodu.value : "", datum_narozeni: pf.faze.value === "po-porodu" ? pf.datum_narozeni.value : "" } }); if (!error) load(); };
    const send = (id, fn) => { const f = document.getElementById(id); f.onsubmit = async e => { e.preventDefault(); const m = f.querySelector("[data-msg]"); m.className = "small z-msg"; m.textContent = "Posílám…"; const ok = await fn(f); m.className = "small z-msg" + (ok ? "" : " err"); m.textContent = ok || "Nepovedlo se, zkus to prosím znovu."; if (ok) f.reset(); }; };
    send("z-cage", async f => { if (f.text.value.trim().length < 20) return f.text.setCustomValidity("Napiš prosím aspoň pár vět."), f.text.reportValidity(), f.text.setCustomValidity(""), "";
      const { error } = await sb.rpc("submit_confession", { p_category: f.cat.value, p_phase: d.week ? (d.week.phase === "tehotenstvi" ? "Čekáme" : d.week.phase === "po-porodu" ? "Po porodu" : "Plánujeme") : null, p_body: f.text.value.trim() });
      return error ? "" : "Díky, že ses svěřil. Po moderaci se objeví v Cage – anonymně."; });
    send("z-myth", async f => { const { error } = await sb.rpc("suggest_myth", { p_text: f.text.value.trim() }); return error ? "" : "Díky! Projdeme ho s odborníky a možná ho brzy rozbijeme na webu."; });
  }

  const SERIES = { "tata-za-5-minut": "Táta za 5 minut", podcast: "Podcast – rozhovory", video: "Videa a návody", pribehy: "Přečtené příběhy" };
  async function renderMedia(d) {
    const box = document.getElementById("z-media"); if (!box) return;
    const { data, error } = await sb.rpc("member_media");
    if (error || !data || !data.length) return;
    const D = 864e5, wk = d.phase === "tehotenstvi" && d.due_date ? 40 - Math.ceil((new Date(d.due_date) - Date.now()) / D / 7) : d.phase === "po-porodu" && d.birth_date ? Math.floor((Date.now() - new Date(d.birth_date)) / D / 7) : null;
    const fits = m => (m.phase === "vse" || m.phase === d.phase) && (wk == null || m.week_from == null || (wk >= m.week_from && wk <= (m.week_to ?? 52)));
    const items = data.filter(fits).concat(data.filter(m => !fits(m)));
    const groups = {}; items.forEach(m => (groups[m.series] = groups[m.series] || []).push(m));
    const urls = {};
    await Promise.all(items.filter(m => m.storage_path && !m.locked).map(async m => { const r = await sb.storage.from("media").createSignedUrl(m.storage_path, 3600); if (r.data) urls[m.id] = r.data.signedUrl; }));
    box.innerHTML = Object.entries(groups).map(([s, arr]) => `<h3 class="mt-3">${esc(SERIES[s] || s)}</h3><div class="grid g2">${arr.map(m => `
      <article class="card media-card${m.locked ? " locked" : ""}">
        <h4 style="margin:0 0 4px">${esc(m.title)}${m.duration_min ? ` <small class="muted">· ${m.duration_min} min</small>` : ""}</h4>
        ${m.description ? `<p class="small">${esc(m.description)}</p>` : ""}
        ${m.locked ? `<p class="small mb-0">🔒 Pro členy ${esc(m.access === "klub-plus" ? "Klubu+" : "Klubu")}. <a href="klub.html#registrace">Odemknout</a></p>` : PPMedia.player(m, urls[m.id])}
      </article>`).join("")}</div>`).join("");
  }

  const { data: { session } } = await sb.auth.getSession();
  if (location.hash.includes("error_code")) { history.replaceState(null, "", location.pathname); return loginForm({ err: true, text: "Odkaz už neplatí. Pošli si prosím nový." }); }
  session ? load() : loginForm();
  sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_IN" && s && !session) setTimeout(load, 0); });
})();
</script>
</body>
</html>
